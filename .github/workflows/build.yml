name: Build Debian 13 GTK 4 bounce packages

on:
  workflow_dispatch:
  push:
    branches: [codex/debian13-gnome48]
    paths:
      - .github/workflows/build.yml
      - source.json
      - patches/**
      - scripts/**
      - bundle/**

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: gtk4-bounce-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates git sudo build-essential devscripts equivs dpkg-dev meson ninja-build \
            python3 xvfb xauth dbus-daemon libgl1-mesa-dri

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, test, and bundle packages
        run: bash scripts/build.sh 2>&1 | tee build.log

      - name: Upload install and rollback bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtk4-bounce-trixie-amd64
          path: dist/gtk4-bounce-trixie-amd64/
          if-no-files-found: error
          retention-days: 90

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtk4-bounce-build-logs
          path: |
            build.log
            _build/gtk4/debian/build/deb/meson-logs/
          if-no-files-found: warn
          retention-days: 30
