name: Complete GTK 3 multiarch bundle

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit used by the completed amd64 build
        required: true
        default: '08d13ebbc6ec374412b47d7292d803b6df95acaa'
      native_run:
        description: Workflow run containing a successful gtk3-packages-amd64 artifact
        required: true
        default: '39788305385'

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  i386:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Use the official Ubuntu HTTPS mirror
        run: |
          sudo /usr/bin/python3 - <<'PY'
          from pathlib import Path
          for path in Path("/etc/apt").glob("*mirrors*.txt"):
              path.write_text("https://archive.ubuntu.com/ubuntu/\n")
          paths = list(Path("/etc/apt/sources.list.d").glob("*.sources"))
          paths += [Path("/etc/apt/sources.list")]
          for path in paths:
              if path.is_file():
                  text = path.read_text()
                  text = text.replace("http://azure.archive.ubuntu.com/ubuntu", "https://archive.ubuntu.com/ubuntu")
                  path.write_text(text)
          Path("/etc/apt/apt.conf.d/90gtk-bounce-ci").write_text(
              'Acquire::ForceIPv4 "true";\nAcquire::Retries "2";\n'
              'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n')
          PY
      - name: Install packaging and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential devscripts equivs dpkg-dev meson ninja-build \
            python3 python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 \
            xvfb xauth dbus-daemon adwaita-icon-theme libgl1-mesa-dri
      - name: Build and test i386 Debian packages
        run: bash gtk3/package.sh i386 2>&1 | tee gtk3-package.log
      - name: Upload tested packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtk3-packages-i386
          path: dist/gtk3-packages-i386/
          if-no-files-found: error
          retention-days: 90
      - name: Upload build and regression logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtk3-package-logs-i386
          path: |
            gtk3-package.log
            _gtk3/packages/i386/source/debian/build/deb/meson-logs/
            _gtk3/packages/i386/test-output/
          if-no-files-found: warn
          retention-days: 30
  bundle:
    needs: i386
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NATIVE_RUN: ${{ inputs.native_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Download completed amd64 build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gtk3-packages-amd64
          path: _gtk3/incoming/gtk3-packages-amd64/
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
      - name: Download completed i386 build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gtk3-packages-i386
          path: _gtk3/incoming/gtk3-packages-i386/
      - name: Assemble install and rollback bundle
        run: |
          printf '%s\n' "https://github.com/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN" > _gtk3/incoming/gtk3-packages-amd64/provenance/ORIGIN_RUN
          printf '%s\n' "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > _gtk3/incoming/gtk3-packages-i386/provenance/ORIGIN_RUN
          /usr/bin/python3 gtk3/bundle.py
      - name: Upload system install bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtk3-bounce-noble-multiarch
          path: dist/gtk3-bounce-noble-multiarch/
          if-no-files-found: error
          retention-days: 90
