name: Validate GTK 3 bounce patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gtk3.yml
      - gtk3/**

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK 3 build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential dpkg-dev meson ninja-build pkgconf sassc \
            libgtk-3-dev libcolord-dev libcups2-dev libxkbfile-dev libjson-glib-dev \
            python3 python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 \
            xvfb xauth dbus-daemon adwaita-icon-theme
      - name: Compile GTK 3 and validate bounce behavior
        run: bash gtk3/build.sh 2>&1 | tee gtk3-build.log
      - name: Upload validated source patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtk3-bounce-3.24.41
          path: dist/gtk3-bounce-3.24.41/
          if-no-files-found: error
          retention-days: 90
      - name: Upload build and regression logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtk3-bounce-validation-logs
          path: |
            gtk3-build.log
            _gtk3/build/meson-logs/
            _gtk3/test-output/
          if-no-files-found: warn
          retention-days: 30
